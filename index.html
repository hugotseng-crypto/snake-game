<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>贪吃蛇小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #eee;
      overflow: hidden; touch-action: none;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.5); letter-spacing: 4px; }
    .score-board { display: flex; gap: 30px; margin-bottom: 16px; font-size: 1.2rem; font-weight: 600; }
    .score-board span { color: #00ff88; }
    #gameCanvas { background: #0d1b2a; border: 3px solid #00ff88; border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,136,0.3); max-width: 95vw; max-height: 70vh; }
    .controls { margin-top: 18px; text-align: center; color: #aaa; font-size: 0.95rem; }
    .btn { margin-top: 16px; padding: 12px 32px; font-size: 1.1rem; font-weight: 600; color: #0d1b2a; background: #00ff88; border: none; border-radius: 30px; cursor: pointer; }
    .mobile-controls { display: none; margin-top: 20px; flex-direction: column; align-items: center; gap: 10px; }
    .mobile-row { display: flex; gap: 10px; }
    .dir-btn { width: 60px; height: 60px; font-size: 1.5rem; background: rgba(0,255,136,0.2); border: 2px solid #00ff88; border-radius: 12px; color: #00ff88; cursor: pointer; }
    @media (max-width: 600px) { .mobile-controls { display: flex; } .controls { display: none; } h1 { font-size: 1.5rem; } }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 2.5rem; color: #00ff88; margin-bottom: 12px; }
    .overlay p { font-size: 1.2rem; margin-bottom: 24px; color: #ccc; }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="score-board">
    <div>得分: <span id="score">0</span></div>
    <div>最高分: <span id="highScore">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">使用方向键 ↑ ↓ ← → 控制（边界可穿越）</div>
  <div class="mobile-controls">
    <div class="mobile-row"><button class="dir-btn" data-dir="up">↑</button></div>
    <div class="mobile-row">
      <button class="dir-btn" data-dir="left">←</button>
      <button class="dir-btn" data-dir="down">↓</button>
      <button class="dir-btn" data-dir="right">→</button>
    </div>
  </div>
  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">贪吃蛇</h2>
    <p id="overlayMsg">按空格键或点击按钮开始游戏</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0, dy = 0, score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameRunning = false, gameLoop = null, speed = 120;
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMsg = document.getElementById('overlayMsg');
    const startBtn = document.getElementById('startBtn');
    highScoreEl.textContent = highScore;
    function draw() {
      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#00ff88' : 'rgba(0, 255, 136, 0.8)';
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }
    function moveSnake() {
      let newX = snake[0].x + dx;
      let newY = snake[0].y + dy;
      if (newX < 0) newX = tileCount - 1; else if (newX >= tileCount) newX = 0;
      if (newY < 0) newY = tileCount - 1; else if (newY >= tileCount) newY = 0;
      const head = { x: newX, y: newY };
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) { gameOver(); return; }
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10; scoreEl.textContent = score;
        if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; localStorage.setItem('snakeHighScore', highScore); }
        if (speed > 60) speed -= 2;
        placeFood();
      } else snake.pop();
    }
    function placeFood() {
      food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
      for (let segment of snake) { if (segment.x === food.x && segment.y === food.y) { placeFood(); return; } }
    }
    function gameStep() { moveSnake(); draw(); }
    function startGame() {
      snake = [{ x: 10, y: 10 }]; dx = 1; dy = 0; score = 0; speed = 120;
      scoreEl.textContent = score; placeFood(); gameRunning = true; overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(gameStep, speed); draw();
    }
    function gameOver() {
      gameRunning = false; clearInterval(gameLoop);
      overlayTitle.textContent = '游戏结束'; overlayMsg.textContent = '本局得分：' + score + ' 分';
      startBtn.textContent = '再来一局'; overlay.classList.remove('hidden');
    }
    document.addEventListener('keydown', (e) => {
      if (!gameRunning && (e.code === 'Space' || e.key === ' ')) { startGame(); return; }
      if (!gameRunning) return;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy !== 1) { dx = 0; dy = -1; }
      if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy !== -1) { dx = 0; dy = 1; }
      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx !== 1) { dx = -1; dy = 0; }
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx !== -1) { dx = 1; dy = 0; }
    });
    document.querySelectorAll('.dir-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!gameRunning) return;
        const dir = btn.dataset.dir;
        if (dir === 'up' && dy !== 1) { dx = 0; dy = -1; }
        if (dir === 'down' && dy !== -1) { dx = 0; dy = 1; }
        if (dir === 'left' && dx !== 1) { dx = -1; dy = 0; }
        if (dir === 'right' && dx !== -1) { dx = 1; dy = 0; }
      });
    });
    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
